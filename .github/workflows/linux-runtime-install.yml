name: Linux runtime auto-install

# The bindings fetch a Gtk 4 runtime on demand when none is installed
# (GRuntimeInstaller -> GLinuxRuntime). This runs that path end to end on bare
# distro images with no system Gtk, so a pass proves the download, the
# conda-forge closure and the full-path load all work. GitHub Actions was
# removed from this repo earlier; this is one focused workflow, triggered on
# demand and when the install path or its script changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'Source/Libs/Shared/**'
      - 'scripts/verify-linux-runtime.sh'
      - '.github/workflows/linux-runtime-install.yml'
  pull_request:
    paths:
      - 'Source/Libs/Shared/**'
      - 'scripts/verify-linux-runtime.sh'

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:forky', 'fedora:latest']
    name: ${{ matrix.image }}
    steps:
      # Checkout runs on the host (bare distro images lack the node a container
      # action needs); the verification itself runs inside the target distro via
      # docker, the working tree mounted in. Matches docs/testing.md's approach.
      - uses: actions/checkout@v4
      - name: Verify on-demand Gtk 4 runtime install
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            "${{ matrix.image }}" \
            bash scripts/verify-linux-runtime.sh
